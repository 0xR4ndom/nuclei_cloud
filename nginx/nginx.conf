# ──────────────────────────────────────────────────────────────────────────────
#  Nuclei Cloud — Nginx Production Configuration
#  - HTTP → HTTPS redirect
#  - TLS 1.2/1.3 with strong cipher suite
#  - HSTS + security headers
#  - SSE streaming (no buffering) + WebSocket upgrade
#  - gzip compression
#  - Rate limiting (API + auth)
# ──────────────────────────────────────────────────────────────────────────────

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m    rate=60r/m;
limit_req_zone $binary_remote_addr zone=auth:10m   rate=10r/m;
limit_req_zone $binary_remote_addr zone=upload:10m rate=5r/m;

# Connection limiting
limit_conn_zone $binary_remote_addr zone=per_ip:10m;

# Upstreams
upstream backend {
    server backend:8000;
    keepalive 32;
}

upstream frontend {
    server frontend:3000;
    keepalive 16;
}

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    # Allow Let's Encrypt / ACME challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS server ───────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2  on;
    server_name _;

    # ── TLS configuration ──────────────────────────────────────────────────────
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # ── Security headers ────────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # CSP: no unsafe-inline; ws/wss allowed for SSE/WebSocket
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss: ws:; font-src 'self'; frame-ancestors 'none';" always;

    # ── General settings ────────────────────────────────────────────────────────
    client_max_body_size 50M;
    limit_conn per_ip 20;

    # ── gzip compression ────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Global proxy timeouts
    proxy_connect_timeout  60s;
    proxy_send_timeout    3600s;
    proxy_read_timeout    3600s;

    # ── SSE stream endpoint (no buffering) ─────────────────────────────────────
    location ~ ^/api/v1/scans/[^/]+/stream$ {
        limit_req zone=api burst=5 nodelay;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE requires no buffering
        proxy_buffering            off;
        proxy_cache                off;
        proxy_set_header Connection "";
        chunked_transfer_encoding  on;

        # Keep SSE connection alive for up to 1 hour
        proxy_read_timeout 3600s;
    }

    # ── File upload endpoint (stricter limit) ──────────────────────────────────
    location /api/v1/targets/upload {
        limit_req zone=upload burst=3 nodelay;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 11M;
    }

    # ── Auth routes (strict rate limit) ────────────────────────────────────────
    location /api/v1/auth/login {
        limit_req zone=auth burst=5 nodelay;

        proxy_pass http://backend;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── General API routes → FastAPI ──────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=30 nodelay;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Disable buffering for JSON streaming
        proxy_buffering off;
    }

    # ── Frontend → Next.js (WebSocket + HMR support) ──────────────────────────
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;

        # WebSocket upgrade headers (required for Next.js HMR and ws:// connections)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_cache_bypass $http_upgrade;

        # Static asset caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://frontend;
            proxy_cache_valid 200 1d;
            add_header Cache-Control "public, max-age=86400, immutable";
        }
    }

    # ── Error pages ────────────────────────────────────────────────────────────
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

