version: "3.9"

x-backend-env: &backend-env
  DATABASE_URL: postgresql://nuclei:nucleipass@postgres:5432/nuclei_cloud
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  SECRET_KEY: ${SECRET_KEY:-change-me-in-production-use-openssl-rand-hex-32}
  NUCLEI_BINARY: /usr/local/bin/nuclei
  NUCLEI_TEMPLATES_DIR: /opt/nuclei-templates
  NUCLEI_CUSTOM_TEMPLATES_DIR: /opt/custom-templates
  NUCLEI_OUTPUT_DIR: /opt/nuclei-output
  FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL:-admin@nucleicloud.local}
  FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:-changeme123!}
  ALLOWED_ORIGINS: '["http://localhost", "http://localhost:3000"]'

services:
  # ── Database ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nuclei_cloud
      POSTGRES_USER: nuclei
      POSTGRES_PASSWORD: nucleipass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nuclei -d nuclei_cloud"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── Cache / Queue ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── FastAPI Backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - nuclei_templates:/opt/nuclei-templates
      - custom_templates:/opt/custom-templates
      - nuclei_output:/opt/nuclei-output
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Celery Worker (Scans queue) ───────────────────────────────────────────
  worker-scans:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker -Q scans -c 4 --loglevel=info
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - nuclei_templates:/opt/nuclei-templates
      - custom_templates:/opt/custom-templates
      - nuclei_output:/opt/nuclei-output
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  # ── Celery Worker (Notifications queue) ──────────────────────────────────
  worker-notifications:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker -Q notifications,default -c 8 --loglevel=info
    environment:
      <<: *backend-env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal

  # ── Celery Beat (Scheduler) ───────────────────────────────────────────────
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat --loglevel=info
    environment:
      <<: *backend-env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal

  # ── Flower (Celery monitoring) ────────────────────────────────────────────
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.workers.celery_app flower --port=5555 --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-flowerpass}
    environment:
      <<: *backend-env
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal

  # ── Next.js Frontend ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ""
    networks:
      - internal
    depends_on:
      - backend

  # ── Nginx Reverse Proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - internal
      - external

volumes:
  postgres_data:
  redis_data:
  nuclei_templates:
  custom_templates:
  nuclei_output:

networks:
  internal:
    driver: bridge
  external:
    driver: bridge
